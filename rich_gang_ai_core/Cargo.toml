[package]
name = "rich_gang_ai_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "daemon"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
# v5 Tier 3 (integrated 2026-10-22, spike-verified first:
# docs/SPIKE_V5_001_PETGRAPH.md). Pure Rust, no C dependencies.
petgraph = "0.8.3"
# v5 Tier 2 (integrated 2026-10-23, spike-verified first:
# docs/SPIKE_V5_002_RUSQLITE.md). Bundled SQLite 3.46.0 compiles from
# C source via the cc crate — the Android build sets CC/AR for the
# target (build_android.sh), same as the spike proved.
rusqlite = { version = "0.32", features = ["bundled"] }
# v5 Tier 5 (integrated 2026-10-23, spike-verified first:
# docs/SPIKE_V5_004_MEMMAP2.md + docs/SPIKE_V5_005_MEMMAP_RING.md).
# Pure Rust wrapper over mmap syscalls, no C dependencies.
memmap2 = "0.9"
log = "0.4"
android_logger = "0.14"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
panic = "unwind"          # NEVER "abort" — a panic inside FFI must not kill the process
lto = true
codegen-units = 1
strip = "debuginfo"       # keep function names for panic logs

[profile.dev]
opt-level = 1
lto = "off"
