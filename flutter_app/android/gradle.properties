# VM build config (2026-10-21): template default was -Xmx8G + 4G metaspace,
# which exceeds this machine's RAM, and the Gradle daemon's loopback socket
# gets a broken pipe in this VM, so builds run in-process: daemon=false and
# jvmargs kept identical to the GRADLE_OPTS the build is invoked with.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
